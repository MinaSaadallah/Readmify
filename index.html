<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Readmify — Interactive GitHub README Builder</title>
  <meta name="description" content="Ultra-easy, interactive GitHub README builder with free GitHub API language auto-detection, SkillIcons, and photo presets." />
  <link rel="icon" type="image/svg+xml" href="./assets/favicon.svg" />

  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            border: '#27272a',
            input: '#27272a',
            ring: '#71717a',
            background: '#09090b',
            foreground: '#fafafa',
            card: {
              DEFAULT: '#121215',
              foreground: '#fafafa'
            },
            muted: {
              DEFAULT: '#18181b',
              foreground: '#a1a1aa'
            },
            accent: {
              DEFAULT: '#27272a',
              foreground: '#fafafa'
            }
          },
          borderRadius: {
            lg: '0.5rem',
            md: '0.375rem',
            sm: '0.25rem',
          }
        }
      }
    }
  </script>

  <!-- External Parsers -->
  <script src="https://cdn.jsdelivr.net/npm/marked@15.0.7/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.4/dist/purify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.4/dist/confetti.browser.min.js"></script>

  <!-- Custom Stylesheets -->
  <link rel="stylesheet" href="./css/styles.css" />
  <link rel="stylesheet" href="./css/github-preview.css" />
</head>
<body class="bg-background text-foreground flex flex-col h-screen overflow-hidden selection:bg-zinc-800 selection:text-zinc-100">

  <!-- TOP NAVBAR (shadcn Header) -->
  <header class="h-14 border-b border-border bg-background/95 backdrop-blur px-4 py-2.5 flex items-center justify-between gap-3 select-none flex-shrink-0 z-30">
    <!-- Brand Logo -->
    <div class="flex items-center gap-3">
      <div class="flex items-center gap-2">
        <div class="w-7 h-7 rounded-md bg-zinc-100 flex items-center justify-center text-zinc-950 font-bold text-xs shadow-sm">
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1-2.5-2.5Z"/>
            <path d="M6 6h10"/>
            <path d="M6 10h10"/>
          </svg>
        </div>
        <span class="text-sm font-semibold tracking-tight text-foreground">Readmify</span>
        <span class="text-[10px] font-medium px-1.5 py-0.5 rounded border border-border bg-muted text-muted-foreground">v3.0</span>
      </div>
    </div>

    <!-- GitHub Deep Scanner & Auto-Detect Bar (Center) -->
    <div class="flex items-center flex-1 max-w-lg mx-2">
      <div class="relative w-full flex items-center">
        <span class="absolute left-2.5 text-muted-foreground text-xs pointer-events-none">🐙</span>
        <input 
          type="text" 
          id="nav-github-input" 
          placeholder="Paste repo link (e.g. facebook/react or github.com/owner/repo)..." 
          class="h-8 w-full pl-7 pr-24 text-xs border border-border bg-card text-foreground placeholder:text-muted-foreground rounded-md focus:outline-none focus:ring-1 focus:ring-ring transition"
        />
        <button 
          id="nav-github-detect-btn" 
          class="absolute right-1 h-6 px-2.5 bg-primary text-primary-foreground hover:bg-zinc-200 text-[11px] font-medium rounded transition flex items-center gap-1 shadow-xs"
          title="Deep Repo Scan: file tree, manifests, dependencies, env vars, scripts"
        >
          <span>⚡</span> Deep Scan
        </button>
      </div>
    </div>

    <!-- Center Segmented Tabs (shadcn Tabs) -->
    <div class="hidden lg:flex items-center bg-muted p-0.5 rounded-lg border border-border">
      <button class="view-mode-btn px-3 py-1 text-xs font-medium rounded-md transition-all bg-background text-foreground shadow-sm" data-mode="split" title="Side-by-side Editor and Live Preview">
        Split View
      </button>
      <button class="view-mode-btn px-3 py-1 text-xs font-medium rounded-md transition-all text-muted-foreground hover:text-foreground" data-mode="editor" title="Full screen Editor for distraction-free writing">
        Editor Focus
      </button>
      <button class="view-mode-btn px-3 py-1 text-xs font-medium rounded-md transition-all text-muted-foreground hover:text-foreground" data-mode="preview" title="Full screen Live GitHub Preview">
        Live Preview
      </button>
      <button class="view-mode-btn px-3 py-1 text-xs font-medium rounded-md transition-all text-muted-foreground hover:text-foreground" data-mode="raw" title="Raw Markdown Output">
        Raw Markdown
      </button>
    </div>

    <!-- Action Buttons -->
    <div class="flex items-center gap-2">
      <!-- Add Section Catalog Button -->
      <button id="nav-add-section-btn" class="h-8 px-3 text-xs font-medium rounded-md bg-zinc-800 hover:bg-zinc-700 text-zinc-100 border border-border transition flex items-center gap-1.5 shadow-sm" title="Explore 16+ pre-built sections">
        <span>➕</span> <span class="hidden sm:inline font-semibold">Add Section</span>
      </button>

      <!-- Photo Presets / Uploader / Cropper Studio -->
      <button id="nav-photos-btn" class="h-8 px-2.5 text-xs font-medium rounded-md border border-border bg-background hover:bg-accent text-muted-foreground hover:text-foreground transition hidden sm:inline-flex items-center gap-1.5" title="Interactive Image Cropper, Resizer & Banner Hub">
        <span>🎨</span> Image Studio
      </button>

      <!-- Easy Guide Button -->
      <button id="nav-wizard-btn" class="h-8 px-3 text-xs font-medium rounded-md bg-muted text-foreground border border-border hover:bg-accent transition flex items-center gap-1.5 shadow-sm" title="Open Easy Guide & Deep Scanner">
        <span>📖</span> <span class="hidden sm:inline">Easy</span> Guide
      </button>

      <!-- Theme Switcher (Dark / Light) -->
      <button id="theme-toggle-btn" class="h-8 px-2 text-xs font-medium rounded-md border border-border bg-background hover:bg-accent text-muted-foreground hover:text-foreground transition flex items-center gap-1" title="Toggle GitHub Preview Light/Dark">
        <span>🌙</span>
      </button>

      <!-- Import Button -->
      <button id="nav-import-btn" class="h-8 px-2 text-xs font-medium rounded-md border border-border bg-background hover:bg-accent text-muted-foreground hover:text-foreground transition hidden sm:inline-flex items-center gap-1" title="Import existing README">
        <span>📥</span>
      </button>

      <!-- Copy Button -->
      <button id="nav-copy-btn" class="h-8 px-3 text-xs font-medium rounded-md border border-border bg-background hover:bg-accent text-foreground transition flex items-center gap-1.5">
        <svg class="w-3.5 h-3.5 text-muted-foreground" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"></path></svg>
        <span class="hidden sm:inline">Copy</span>
      </button>

      <!-- Download Button -->
      <button id="nav-download-btn" class="h-8 px-3 text-xs font-medium rounded-md bg-primary text-primary-foreground hover:bg-zinc-200 transition flex items-center gap-1.5 shadow-sm">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
        <span class="hidden sm:inline">Download</span> .md
      </button>
    </div>
  </header>

  <!-- MAIN WORKSPACE LAYOUT -->
  <main class="flex-1 flex flex-col lg:flex-row overflow-hidden relative">

    <!-- LEFT PANE: MODULAR EDITOR -->
    <div id="editor-left-pane" class="w-full lg:w-1/2 h-full flex flex-col border-r border-border bg-background overflow-hidden">
      
      <!-- TOP BAR: HORIZONTAL SECTION PILL BAR & WORKSPACE CONTROLS -->
      <div class="border-b border-border bg-card/60 px-3 py-2 flex items-center justify-between gap-2 overflow-hidden flex-shrink-0">
        <!-- Horizontal scrollable pills for instant section jumping -->
        <div id="section-pill-bar" class="flex items-center gap-1.5 overflow-x-auto no-scrollbar py-0.5 flex-1 min-w-0">
          <!-- Dynamically populated chips -->
        </div>

        <!-- Right Quick Controls -->
        <div class="flex items-center gap-1.5 flex-shrink-0 border-l border-border pl-2">
          <button id="pill-add-section-btn" class="h-7 px-2.5 text-xs font-medium rounded-md bg-primary text-primary-foreground hover:bg-zinc-200 transition flex items-center gap-1 shadow-xs" title="Explore Section Library">
            <span>➕</span> <span class="hidden sm:inline">Add</span>
          </button>
          <button id="toggle-section-drawer-btn" class="h-7 px-2 text-xs font-medium rounded-md border border-border bg-background hover:bg-accent text-muted-foreground hover:text-foreground transition" title="Toggle Section List & Ordering Drawer">
            <span>☰</span>
          </button>
          <button id="reset-template-btn" class="h-7 px-2 text-xs text-muted-foreground hover:text-rose-400 hover:bg-rose-500/10 rounded border border-border transition" title="Reset to Defaults">
            <span>↺</span>
          </button>
        </div>
      </div>

      <!-- COLLAPSIBLE SECTION REORDER DRAWER (Toggled with ☰) -->
      <div id="section-drawer-panel" class="hidden border-b border-border bg-card/95 px-3 py-2.5 max-h-56 overflow-y-auto flex-shrink-0 transition-all">
        <div class="flex items-center justify-between pb-2 mb-2 border-b border-border text-[11px] text-muted-foreground">
          <span class="font-semibold uppercase tracking-wider text-foreground">All Sections & Reordering</span>
          <div class="flex items-center gap-2">
            <button id="add-custom-sec-btn" class="text-[11px] font-medium text-foreground hover:bg-accent px-1.5 py-0.5 rounded border border-border transition">
              + Custom
            </button>
            <button id="close-section-drawer-btn" class="text-xs hover:text-foreground p-0.5">✕</button>
          </div>
        </div>
        <div id="section-list-items" class="space-y-1">
          <!-- Dynamically populated list with up/down/toggle -->
        </div>
      </div>

      <!-- SECTION FORM INPUTS (Full width, spacious & customizable) -->
      <div id="section-editor-container" class="flex-1 h-full overflow-y-auto bg-card/10">
        <!-- Rendered dynamically -->
      </div>
    </div>

    <!-- RIGHT PANE: LIVE GITHUB PREVIEW -->
    <div id="editor-right-pane" class="w-full lg:w-1/2 h-full flex flex-col bg-background overflow-hidden">
      
      <!-- Preview Header Bar -->
      <div class="px-4 py-2.5 bg-background border-b border-border flex items-center justify-between flex-shrink-0">
        <div class="flex items-center gap-2">
          <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
          <span class="text-xs font-semibold text-foreground">GitHub Preview</span>
          <span id="health-score-badge" class="ml-2 px-2 py-0.5 text-[10px] font-medium rounded-full border border-border bg-muted">
            <span id="health-score-text">Calculating...</span>
          </span>
        </div>

        <!-- Stats Counter -->
        <div class="flex items-center gap-2 text-[11px] text-muted-foreground">
          <span id="stats-word-count">0 words</span>
          <span>•</span>
          <span id="stats-char-count">0 chars</span>
          <span>•</span>
          <span id="stats-reading-time">~1 min</span>
        </div>
      </div>

      <!-- Health Score Tip Bar -->
      <div id="health-score-tip" class="px-4 py-1.5 bg-muted/40 border-b border-border text-[11px] text-muted-foreground truncate">
        💡 Tip: Add a clear description and key features to engage readers.
      </div>

      <!-- Preview Render Tab -->
      <div id="preview-render-tab" class="flex-1 overflow-y-auto relative">
        <div id="github-preview-body" class="markdown-body github-dark">
          <!-- Rendered markdown inserted here -->
        </div>
      </div>

      <!-- Raw Markdown Code Tab -->
      <div id="preview-raw-tab" class="flex-1 hidden flex flex-col p-4 bg-background">
        <textarea 
          id="raw-markdown-textarea" 
          class="w-full flex-1 bg-card border border-border rounded-md p-4 text-xs font-mono text-foreground focus:outline-none focus:ring-1 focus:ring-ring resize-none leading-relaxed" 
          placeholder="# Markdown code will appear here..."
        ></textarea>
      </div>
    </div>

  </main>

  <!-- SECTION LIBRARY CATALOG MODAL CONTAINER -->
  <div id="section-library-modal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-xs hidden"></div>

  <!-- PHOTO / BANNER HUB MODAL CONTAINER -->
  <div id="photo-hub-modal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-xs hidden"></div>

  <!-- IMPORT README MODAL (shadcn Dialog) -->
  <div id="import-readme-modal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-xs hidden">
    <div class="bg-card border border-border rounded-lg w-full max-w-xl p-5 shadow-2xl space-y-4">
      <div class="flex items-center justify-between pb-3 border-b border-border">
        <h3 class="text-sm font-semibold text-foreground flex items-center gap-2">
          <span>📥</span> Import Existing README.md
        </h3>
        <button id="close-import-modal-btn" class="text-muted-foreground hover:text-foreground text-xs p-1">✕</button>
      </div>
      <p class="text-xs text-muted-foreground">Paste your raw Markdown text below or upload a .md file:</p>
      <input type="file" id="import-file-input" accept=".md,.markdown,.txt" class="block w-full text-xs text-muted-foreground file:mr-3 file:py-1.5 file:px-3 file:rounded-md file:border file:border-border file:text-xs file:font-medium file:bg-muted file:text-foreground hover:file:bg-accent" />
      <textarea id="import-markdown-textarea" rows="8" class="form-input font-mono text-xs" placeholder="# Paste your markdown here..."></textarea>
      <div class="flex justify-end gap-2 pt-1">
        <button id="apply-import-btn" class="btn-primary text-xs px-3 py-1.5">
          Import Content
        </button>
      </div>
    </div>
  </div>

  <!-- TOAST CONTAINER -->
  <div id="readmify-toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2 pointer-events-none"></div>

  <!-- Universal Bundle Script (Standard Non-Module Script for 100% offline & GitHub Pages compatibility) -->
  <script src="./js/readmify.bundle.js"></script>
</body>
</html>
