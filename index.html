<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Readmify — GitHub README Builder</title>
  <link id="github-markdown-theme-link" rel="stylesheet" href="https://cdn.jsdelivr.net/npm/github-markdown-css@5.8.1/github-markdown-dark.css" />
  <link rel="stylesheet" href="css/app.css" />
  <script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1/dist/confetti.browser.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
</head>
<body>

  <header>
    <div class="brand">
      <span>Readmify</span>
    </div>

    <div class="view-mode-toggle">
      <button class="view-mode-btn active" data-mode="editor">Editor</button>
      <button class="view-mode-btn" data-mode="preview">Preview</button>
    </div>

    <div class="header-actions">
      <div class="save-indicator">
        <span class="save-dot saved" id="save-state-dot"></span>
        <span id="save-state-text">Saved</span>
      </div>

      <button class="btn-ghost" id="nav-photos-btn" title="Jump to photos">Photos</button>
      <button class="btn-ghost" id="nav-badges-btn" title="Jump to badges">Badges</button>
      <button class="btn-primary" id="nav-add-section-btn">Add Section</button>
      <button class="icon-btn" id="nav-palette-btn" title="Command palette (Ctrl+K)">⌘K</button>

      <div class="menu-wrap">
        <button class="btn-secondary" id="nav-download-btn">Export</button>
      </div>
      <div class="menu-wrap">
        <button class="icon-btn" id="export-menu-btn" title="Export options">▾</button>
        <div class="menu-dropdown hidden" id="export-menu">
          <button id="export-menu-copy">Copy markdown</button>
          <button id="export-menu-download">Download README.md</button>
        </div>
      </div>
      <div class="menu-wrap">
        <button class="icon-btn" id="nav-overflow-btn" title="More actions">⋯</button>
        <div class="menu-dropdown hidden" id="nav-overflow-menu">
          <button data-overflow="guide">Quick Start</button>
          <button data-overflow="import">Import README</button>
          <button data-overflow="theme">Toggle preview theme</button>
          <button data-overflow="copy">Copy markdown</button>
          <button data-overflow="reset" class="danger">Reset to default</button>
        </div>
      </div>
    </div>
  </header>

  <main>
    <section id="editor-pane">
      <div class="pane-toolbar">
        <strong style="font-size:12px;">Edit</strong>
        <span class="field-hint" style="margin-left:auto;">Changes appear instantly on the right →</span>
      </div>
      <div id="editor-pane-body"><!-- section cards rendered by sectionFormList.js --></div>
    </section>

    <section id="preview-pane">
      <div class="pane-toolbar">
        <div class="pane-tabs">
          <button class="pane-tab active" id="preview-tab-btn">Preview</button>
          <button class="pane-tab" id="raw-tab-btn">Code</button>
        </div>
        <span class="health-badge" id="health-score-badge">
          <span id="health-score-text">–</span>
        </span>
      </div>
      <ul id="health-score-tips"></ul>
      <div id="preview-body-wrap" class="theme-dark">
        <div id="preview-body" class="markdown-body"></div>
      </div>
      <textarea id="raw-view" class="hidden" readonly spellcheck="false"></textarea>
    </section>
  </main>

  <!-- Import README modal -->
  <div id="import-modal" class="modal-backdrop hidden">
    <div class="modal-card">
      <div class="modal-header">
        <h3>Import existing README</h3>
        <button type="button" class="modal-close-btn" id="import-cancel-btn">✕</button>
      </div>
      <p class="field-hint">Paste markdown below. It becomes a single editable Custom section.</p>
      <textarea id="import-textarea" class="field-input field-mono" rows="10" placeholder="# My Project..."></textarea>
      <div style="margin-top:10px; text-align:right;">
        <button type="button" class="btn-primary" id="import-apply-btn">Import</button>
      </div>
    </div>
  </div>

  <!-- Command palette -->
  <div id="cmd-palette-backdrop" class="hidden">
    <div id="cmd-palette">
      <input type="text" id="cmd-palette-input" placeholder="Type a command or search sections..." />
      <div id="cmd-palette-list"></div>
    </div>
  </div>

  <script defer src="js/readmify.bundle.js"></script>
</body>
</html>
